[project]
name = "alteraparser"
version = "2.0.0"
authors = [
    { name = "Thomas Bollmeier", email = "developer@thomas-bollmeier.de" }
]
description = "Alteraparser is a library that provides functions to define a grammar that can be passed to a parser."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
